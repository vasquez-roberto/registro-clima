name: Actualizar Calidad del Aire Monterrey

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Extracción
      run: python main.py

    - name: Guardar Cambios Automáticamente
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated update: Registros de calidad del aire Monterrey"
        file_pattern: 'data/calidad_aire.csv'